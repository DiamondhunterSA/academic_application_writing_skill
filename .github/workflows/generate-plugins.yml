name: Generate Plugins

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  SKILLS_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request' || github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyyaml
      - name: Test packaging and read-only validation
        run: python -B -m unittest discover -s .github/tests -v
      - name: Validate committed artifacts without writing
        run: python -B .github/scripts/validate-repository.py

  generate:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install pyyaml

      - name: Test packaging and read-only validation
        run: python -B -m unittest discover -s .github/tests -v

      - name: Generate plugins
        run: python -B .github/scripts/generate-plugins.py

      - name: Update README index
        run: python -B .github/scripts/update-readme.py

      - name: Validate generated artifacts without writing
        run: python -B .github/scripts/validate-repository.py

      - name: Commit and push generated artifacts
        shell: bash
        run: |
          set -euo pipefail
          git add -- plugins/ .claude-plugin/plugin.json .claude-plugin/marketplace.json README.md
          if git diff --staged --quiet; then
            echo "Generated artifacts are already up to date."
            exit 0
          fi

          remote_head="$(git ls-remote --exit-code origin "refs/heads/${SKILLS_DEFAULT_BRANCH}" | cut -f1)"
          if [[ "$remote_head" != "$GITHUB_SHA" ]]; then
            echo "::notice::Skipping generated-artifact commit and push because ${SKILLS_DEFAULT_BRANCH} advanced after checkout."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Update generated plugins and README"
          git push origin "HEAD:refs/heads/${SKILLS_DEFAULT_BRANCH}"
